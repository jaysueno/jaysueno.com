<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="t d">
<title id="t">How the site is built</title>
<desc id="d">The build in five columns: pages, data, essays and photos go through astro build, which writes 25 HTML pages, rss.xml, resume.json and a sitemap to dist/, then scripts/postbuild-agents.mjs adds typographic quotes, Markdown twins and llms.txt and fails on any em dash, and the static files are served as is.</desc>
<rect x="0" y="0" width="1200" height="470" fill="#EDE7DC"/><rect x="1" y="1" width="1198" height="468" fill="#001B3B"/>
<text x="40" y="62" font-family="Georgia, 'Playfair Display', serif" font-size="34" fill="#F2EDE2">How the site is built</text>
<text x="40" y="94" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#D8D3CA">Plain files in, static files out.</text>
<text x="40" y="136" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#D8D3CA">Plain files</text>
<text x="300" y="136" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#D8D3CA">Build</text>
