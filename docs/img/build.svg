<text x="56" y="183" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#F2EDE2">src/pages/ (*.astro)</text>
<rect x="276" y="175" width="5" height="4" fill="#8C5348"/><polygon points="280,168 294,177 280,186" fill="#8C5348"/>
<rect x="40" y="222" width="230" height="54" fill="#EDE7DC"/><rect x="41" y="223" width="228" height="52" fill="#001B3B"/>
<text x="56" y="255" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#F2EDE2">src/data/ (*.ts)</text>
<rect x="276" y="247" width="5" height="4" fill="#8C5348"/><polygon points="280,240 294,249 280,258" fill="#8C5348"/>
<rect x="40" y="294" width="230" height="54" fill="#EDE7DC"/><rect x="41" y="295" width="228" height="52" fill="#001B3B"/>
<text x="56" y="327" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#F2EDE2">src/content/essays/ (*.md)</text>
<rect x="276" y="319" width="5" height="4" fill="#8C5348"/><polygon points="280,312 294,321 280,330" fill="#8C5348"/>
<rect x="40" y="366" width="230" height="54" fill="#EDE7DC"/><rect x="41" y="367" width="228" height="52" fill="#001B3B"/>
<text x="56" y="399" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#F2EDE2">src/assets/photos/ (*.jpg)</text>
<rect x="276" y="391" width="5" height="4" fill="#8C5348"/><polygon points="280,384 294,393 280,402" fill="#8C5348"/>
<rect x="300" y="150" width="190" height="270" fill="#EDE7DC"/><rect x="301" y="151" width="188" height="268" fill="#001B3B"/>
<text x="318" y="188" font-family="Georgia, 'Playfair Display', serif" font-size="22" fill="#F2EDE2">astro build</text>
<text x="318" y="220" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#D8D3CA">@astrojs/sitemap</text>
<text x="318" y="242" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#D8D3CA"></text>
<text x="318" y="264" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#D8D3CA">sharp makes AVIF</text>
<text x="318" y="286" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#D8D3CA">and WebP from</text>
<text x="318" y="308" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#D8D3CA">each photo</text>
