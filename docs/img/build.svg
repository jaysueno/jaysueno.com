<text x="538" y="242" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#D8D3CA">rss.xml</text>
<text x="538" y="264" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#D8D3CA">resume.json</text>
<text x="538" y="286" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#D8D3CA">sitemap</text>
<rect x="720" y="150" width="240" height="270" fill="#EDE7DC"/><rect x="721" y="151" width="238" height="268" fill="#001B3B"/>
<text x="738" y="188" font-family="Georgia, 'Playfair Display', serif" font-size="22" fill="#F2EDE2">postbuild</text>
<text x="738" y="220" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#D8D3CA">postbuild-agents.mjs</text>
<text x="738" y="242" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#D8D3CA"></text>
<text x="738" y="264" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#D8D3CA">typographic quotes</text>
<text x="738" y="286" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#D8D3CA">an index.md twin next</text>
<text x="738" y="308" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#D8D3CA">to every page but 404</text>
